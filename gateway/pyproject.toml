[project]
name = "moveuff-gateway"
version = "0.1.0"
description = "MoveUFF MMS telemetry gateway API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

